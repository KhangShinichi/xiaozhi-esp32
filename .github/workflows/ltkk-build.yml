name: LTKK - Build firmware

# Tự build firmware Xiaozhi LTKK trên máy chủ GitHub, không cần cài gì trên máy.
# Chạy tay: tab Actions -> "LTKK - Build firmware" -> Run workflow.
# Tự chạy mỗi khi bạn sửa file trong thư mục board LTKK.

on:
  workflow_dispatch:
  push:
    paths:
      - "main/boards/ltkk-esp32s3-2.8/**"
      - ".github/workflows/ltkk-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Build firmware LTKK (tiếng Việt)
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py ltkk-esp32s3-2.8 --language vi-VN

      - name: Tải firmware về
        uses: actions/upload-artifact@v4
        with:
          name: ltkk-xiaozhi-firmware
          path: build/merged-binary.bin
          if-no-files-found: error
